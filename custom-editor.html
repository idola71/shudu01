﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义游戏 - 趣味数独乐园</title>
    <script>
        // 在页面加载前设置主题，避免闪烁
        (function() {
            const savedTheme = localStorage.getItem('currentTheme') || 'orange';
            const themes = {
                orange: 'linear-gradient(180deg, #FFA726 0%, #FF7043 100%)',
                blue: 'linear-gradient(180deg, #1E88E5 0%, #1565C0 100%)',
                purple: 'linear-gradient(180deg, #7E57C2 0%, #5E35B1 100%)',
                green: 'linear-gradient(180deg, #43A047 0%, #2E7D32 100%)',
                pink: 'linear-gradient(180deg, #EC407A 0%, #D81B60 100%)',
                cyan: 'linear-gradient(180deg, #00ACC1 0%, #00838F 100%)',
                dark: 'linear-gradient(180deg, #1a1a2e 0%, #16213e 100%)'
            };
            document.documentElement.style.setProperty('--theme-gradient', themes[savedTheme] || themes.orange);
        })();
    </script>
    <link rel="stylesheet" href="game.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="message-popup.css">
    <style>
        .code-input-section {
            padding: 10px 20px 0;
            margin: 10px auto 0;
            max-width: 600px;
            border: none;
            background: transparent;
            backdrop-filter: none;
            border-radius: 0;
        }

        .code-input-header {
            display: none;
        }

        .code-input-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 0;
            align-items: center;
            background: transparent;
            border-radius: 0;
        }

        .code-input {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 0;
            font-size: 14px;
            background: transparent;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
            font-family: "Noto Sans SC", "Source Han Sans CN", "Microsoft YaHei", sans-serif;
            outline: none;
        }

        .code-input:focus {
            outline: none;
            border-bottom-color: #FFFFFF;
            background: transparent;
        }

        .code-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .generate-btn {
            padding: 10px 20px;
            background: transparent;
            color: #FFFFFF;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: "Noto Sans SC", "Source Han Sans CN", "Microsoft YaHei", sans-serif;
            white-space: nowrap;
        }

        .generate-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #FFFFFF;
        }

        .generate-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .code-error {
            color: #FFCDD2;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
            padding-top: 8px;
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="logo-section">
            <img src="images/网站logo.svg" alt="趣味数独乐园" class="logo">
            <nav class="nav-tabs">
                <button class="tab" onclick="window.location.href='game.html'">趣味数独</button>
                <button class="tab active" onclick="window.location.href='custom-editor.html'">自定义游戏</button>
            </nav>
        </div>

        <div class="header-icons">
            <a href="index.html"><img src="images/主页图标.svg" alt="首页"></a>
            <a href="account.html" data-action="account"><img src="images/账号图标.svg" alt="账号"></a>
            <a href="#" id="messageBtn" style="position: relative;"><img src="images/消息图标.svg" alt="消息"><span id="messageBadge"></span></a>
            <a href="#" onclick="event.preventDefault(); event.stopPropagation(); toggleSettingsMenu(this);"><img src="images/设置图标.svg" alt="设置"></a>
        </div>
    </header>

    <main class="game-main">
        <div class="difficulty-timer-wrapper">
            <button class="difficulty-btn" id="difficultyBtn" disabled>
                <span class="difficulty-text">难度</span>
                <span class="difficulty-stars">★★</span>
            </button>
            <div class="timer-display" id="timerDisplay">
                <span class="editor-label">编辑器</span>
            </div>
            <button class="music-control-btn" id="musicControlBtn" title="背景音乐">
                <img class="music-icon" src="images/音乐开关.svg" alt="音乐" />
            </button>
        </div>

        <div class="game-content">
            <div class="sudoku-grid">
                <div class="grid-container" id="gridContainer">
                    <!-- 第1行 -->
                    <div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <!-- 第2行 -->
                    <div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <!-- 第3行 -->
                    <div class="cell thick-bottom"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom thick-right"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom thick-right"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom"></div>
                    <!-- 第4行 -->
                    <div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <!-- 第5行 -->
                    <div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <!-- 第6行 -->
                    <div class="cell thick-bottom"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom thick-right"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom thick-right"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom"></div><div class="cell thick-bottom"></div>
                    <!-- 第7行 -->
                    <div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <!-- 第8行 -->
                    <div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <!-- 第9行 -->
                    <div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell thick-right"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                </div>
            </div>

            <div class="control-panel">
                <div class="num-pad" id="numberPad"></div>
            </div>
        </div>

        <!-- 编码输入区域 -->
        <div class="code-input-section">
            <div class="code-input-wrapper">
                <input type="text" id="gameCodeInput" class="code-input" placeholder="输入或粘贴游戏编码，快速加载他人分享的数独">
                <button class="generate-btn" onclick="generateGameFromCode()">生成</button>
            </div>
            <div class="code-error" id="codeError"></div>
        </div>
    </main>

    <footer>
        趣味数独乐园@王板凳
    </footer>

    <script src="js/user.js"></script>
    <script src="js/user-menu.js"></script>
    <script src="js/custom-editor.js"></script>
    <script src="js/settings-menu.js"></script>
    <script src="js/audio-manager.js"></script>
    <script src="js/sound-manager.js"></script>
    <script src="js/message-popup.js"></script>
</body>
</html>
