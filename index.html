<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独共创乐园</title>
    <script>
        // 在页面加载前设置主题，避免闪烁
        (function() {
            const savedTheme = localStorage.getItem('currentTheme') || 'orange';
            const themes = {
                orange: 'linear-gradient(135deg, #FFA726 0%, #FF7043 100%)',
                blue: 'linear-gradient(135deg, #1E88E5 0%, #1565C0 100%)',
                purple: 'linear-gradient(135deg, #7E57C2 0%, #5E35B1 100%)',
                green: 'linear-gradient(135deg, #43A047 0%, #2E7D32 100%)',
                pink: 'linear-gradient(135deg, #EC407A 0%, #D81B60 100%)',
                cyan: 'linear-gradient(135deg, #00ACC1 0%, #00838F 100%)',
                dark: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)'
            };
            document.documentElement.style.setProperty('--theme-gradient', themes[savedTheme] || themes.orange);
        })();
    </script>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="message-popup.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <a href="index.html"><img src="public/images/主页图标.svg" alt="首页"></a>
        <a href="account.html" data-action="account"><img src="public/images/账号图标.svg" alt="账号"></a>
        <a href="#" id="messageBtn" style="position: relative;">
            <img src="public/images/消息图标.svg" alt="消息">
            <span id="messageBadge"></span>
        </a>
        <a href="#" onclick="event.preventDefault(); event.stopPropagation(); toggleSettingsMenu(this);"><img src="public/images/设置图标.svg" alt="设置"></a>
    </nav>

    <!-- 主要内容 -->
    <div class="main-content">
        <div class="left-section">
            <h1>数独共创乐园</h1>
            <p>在这里你可以体验趣味数独，锻炼逻辑思维；<br>
            也可以创作、分享专属数独题目，汇聚爱好者一同闯关交流。</p>
            
            <!-- 数独网格预览 -->
            <img src="public/images/说明下面的图片.svg" alt="数独网格" class="sudoku-image">
        </div>

        <div class="right-section">
            <a href="game.html" class="card-link">
                <div class="card game-card">
                    <div class="card-icon-wrapper">
                        <img src="public/images/趣味数独图标.svg" alt="趣味数独" class="card-icon">
                    </div>
                    <div class="card-title">趣味数独</div>
                    <div class="card-desc">开始自己的数独游戏→</div>
                </div>
            </a>

            <a href="paradise.html" class="card-link">
                <div class="card paradise-card">
                    <div class="card-icon-wrapper">
                        <img src="public/images/共创乐园图标.svg" alt="共创乐园" class="card-icon">
                    </div>
                    <div class="card-title">共创乐园</div>
                    <div class="card-desc">参与其他玩家分享的数独游戏→</div>
                </div>
            </a>
        </div>
    </div>

    <footer>
        数独共创乐园@王板凳
    </footer>

    <script src="js/user.js"></script>
    <script src="js/user-menu.js"></script>
    <script src="js/settings-menu.js"></script>
    <script src="js/audio-manager.js"></script>
    <script src="js/message-popup.js"></script>
</body>
</html>
